server {
  listen 80; listen [::]:80; server_name arrow.symbiose.si;
  location ^~ /.well-known/acme-challenge/ { root /var/www/painel-acme; }
  location / { return 301 https://$host$request_uri; }
}
server {
  listen 443 ssl; listen [::]:443 ssl; http2 on; server_name arrow.symbiose.si;
  ssl_certificate /etc/letsencrypt/live/arrow.symbiose.si/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/arrow.symbiose.si/privkey.pem;
  root /opt/the-last-arrow/current/dist; index index.html;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  location / { try_files $uri $uri/ /index.html; add_header Cache-Control no-cache; }
  location /assets/ { try_files $uri =404; expires 1h; }
  location = /ws {
    proxy_pass http://127.0.0.1:8890; proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade; proxy_set_header Connection "upgrade";
    proxy_set_header Host $host; proxy_read_timeout 75s;
  }
  location = /health { proxy_pass http://127.0.0.1:8890; add_header Cache-Control no-store; }
}
